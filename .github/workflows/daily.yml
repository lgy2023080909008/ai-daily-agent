name: daily

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC：UTC 00:xx = 北京时间 08:xx
    # 为什么不写 0 0 * * *：官方文档说明整点（:00）是调度最拥堵的时刻，
    # 排在整点的任务经常被延迟，高峰期甚至会被直接丢弃。
    # 错开到 :07 能显著降低被丢的概率（国内无夏令时，全年 +8）。
    - cron: "7 0 * * *"
  workflow_dispatch: {}   # 支持手动触发，方便调试

# 同一个时间只跑一个，避免手动触发和定时撞车
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      # 关键：Actions 每次都是全新容器，不挂载的话 data/aidaily.db 每天从零开始，
      # 于是"同一篇不重复推"的逻辑在 CI 里等于没生效（每天都会重复挑选同样内容）。
      # 用 cache 把 SQLite 和抓取缓存带过来，key 用 run_id 保证每次都能写入新缓存，
      # restore-keys 前缀保证能拿回最近一次的库。
      - name: Restore digest state
        uses: actions/cache@v4
        with:
          path: |
            data/aidaily.db
            data/cache
          key: aidaily-state-${{ github.run_id }}
          restore-keys: |
            aidaily-state-

      - name: Generate and push digest
        env:
          # ---- LLM ----
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 默认走 http 后端：不依赖 openai SDK 版本，CI 上更稳
          LLM_BACKEND: ${{ secrets.LLM_BACKEND || 'http' }}
          # ---- 推送 ----
          NOTIFY_CHANNEL: ${{ secrets.NOTIFY_CHANNEL || 'console' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # ---- 其他（没配就用默认值）----
          SOURCES: ${{ secrets.SOURCES || 'arxiv,huggingface,github,rss,hackernews' }}
          TOP_N: ${{ secrets.TOP_N || '5' }}
        run: python -m aidaily

      # 把当天日报作为 artifact 留存，即使推送渠道失败也能取回
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: data/digests/
          if-no-files-found: ignore
