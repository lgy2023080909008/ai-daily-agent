name: daily

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC 时间：UTC 00:00 = 北京时间 08:00
    # 注意：国内没有夏令时，全年都是 +8，所以不需要考虑时区切换
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 支持手动触发，方便调试

# 同一个时间只跑一个，避免手动触发和定时撞车
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Generate and push digest
        env:
          # ---- LLM ----
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 默认走 http 后端：不依赖 openai SDK 版本，CI 上更稳
          LLM_BACKEND: ${{ secrets.LLM_BACKEND || 'http' }}
          # ---- 推送 ----
          NOTIFY_CHANNEL: ${{ secrets.NOTIFY_CHANNEL || 'console' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # ---- 其他（没配就用默认值）----
          SOURCES: ${{ secrets.SOURCES || 'arxiv,huggingface,github,rss,hackernews' }}
          TOP_N: ${{ secrets.TOP_N || '5' }}
        run: python -m aidaily

      # 把当天日报作为 artifact 留存，即使推送渠道失败也能取回
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: data/digests/
          if-no-files-found: ignore
